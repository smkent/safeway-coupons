services:
  safeway-coupons:
    image: ghcr.io/smkent/safeway-coupons:latest
    environment:
      PYTHONUNBUFFERED: 1
      CRON_SCHEDULE: "0 2 * * *"
      SMTPHOST: your.smtp.host
      SAFEWAY_ACCOUNT_USERNAME: your.safeway.account.email@example.com
      SAFEWAY_ACCOUNT_PASSWORD: very_secret
      SAFEWAY_ACCOUNT_MAIL_FROM: your.email@example.com
      SAFEWAY_ACCOUNT_MAIL_TO: your.email@example.com
      # Cookie auth (optional, bypasses browser login). Export these in your
      # shell and they are passed through to the container. Note: the session
      # access token expires about 45 minutes after it is issued.
      SWY_SHARED_SESSION: "${SWY_SHARED_SESSION:-}"
      SWY_SHARED_SESSION_INFO: "${SWY_SHARED_SESSION_INFO:-}"
    restart: unless-stopped
