services:
  safeway-coupons:
    image: ghcr.io/smkent/safeway-coupons:latest
    environment:
      PYTHONUNBUFFERED: 1
      CRON_SCHEDULE: "0 2 * * *"
      SMTPHOST: your.smtp.host
      SAFEWAY_ACCOUNT_USERNAME: your.safeway.account.email@example.com
      SAFEWAY_ACCOUNT_PASSWORD: very_secret
      SAFEWAY_ACCOUNT_MAIL_FROM: your.email@example.com
      SAFEWAY_ACCOUNT_MAIL_TO: your.email@example.com
      # Optional: environment variables for cookie auth fallback (bypasses browser login)
      SWY_SHARED_SESSION: '{"accessToken": "your_session_cookie_value"}'
      SWY_SHARED_SESSION_INFO: '{"info": {"J4U": {"storeId": 123}}}'
    restart: unless-stopped
