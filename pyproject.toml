[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "safeway-coupons"
dynamic = ["version"]
description = "Automatic coupon clipper for Safeway's online \"Safeway for U\" coupons"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["COPYING"]
requires-python = ">=3.11"
authors = [{ name = "Stephen Kent", email = "smkent@smkent.net" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development",
  "Topic :: Utilities",
  "Typing :: Typed",
]
keywords = []
dependencies = [
  "dataclasses-json",
  "patchright>=1.62",
  "platformdirs>=4.14",
  "requests",
  "typer>=0.27",
]

[project.scripts]
"safeway-coupons" = "safeway_coupons.__main__:main"

[project.urls]
Homepage = "https://smkent.github.io/safeway-coupons"
Repository = "https://github.com/smkent/safeway-coupons"
Issues = "https://github.com/smkent/safeway-coupons/issues"

[dependency-groups]
dev = [
  "bump-my-version>=1.3.0",
  "commit-check>=2.18",
  "pysentry-rs>=0.5",
  "pytest>=9,<9.2",
  "pytest-cov>=7",
  "pytest-sugar>=1",
  "pytest-xdist>=3",
  "responses",
  "ruff>=0.17",
  "syrupy>=5",
  "ty>=0.0.84",
  "types-requests",
]
docs = ["mkdocstrings[python]>=1", "zensical>=0.1"]

[tool.bumpversion]
commit = false
tag = true
tag_name = "v{new_version}"
tag_message = ""
push = true

[tool.hatch.build.targets.sdist]
include = ["/safeway_coupons", "/tests", "*.md", "COPYING"]

[tool.hatch.build.targets.wheel]
packages = ["safeway_coupons"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.pytest]
addopts = [
  "-ra",
  "--cov=safeway_coupons",
  "--strict-config",
  "--strict-markers",
  "--numprocesses",
  "auto",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["safeway_coupons"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "@abstractmethod"]

[tool.ruff]
line-length = 79
output-format = "concise"
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
  "COM812", # Trailing comma missing
  "CPY001", # Missing copyright notice at top of file
  "D1",     # Missing docstring presence rules
  "EM",     # flake8-errmsg
  "G004",   # Logging statement uses f-string
  "PLR",    # pylint Refactor
  "S607",   # Starting a process with a partial executable path
  "TD",     # flake8-todos
  "TRY003", # Avoid specifying long messages outside the exception class
]

[tool.ruff.lint.isort]
known-first-party = ["safeway_coupons"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "ARG",  # flake8-unused-arguments
  "S101", # Use of assert detected
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.src]
include = ["safeway_coupons/", "tests/"]

[tool.ty.terminal]
error-on-warning = true
output-format = "concise"

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { git = { commit = true, tags = true } },
]
default-groups = ["dev", "docs"]

[tool.uv-dynamic-versioning]
pattern = "default-unprefixed"
fallback-version = "0.0.0"
