name: Container

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - v[0-9]*.[0-9]*
  workflow_dispatch:
    inputs:
      latest-auto:
        description: Rebuild this release tag as only `latest-auto`
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: 💾 Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🏷️ Determine project version
        id: version
        run: |
          pip install --quiet uv
          version="$(uvx --exclude-newer=P1W uv-dynamic-versioning)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "::notice title=Project version::${version}"

  image:
    name: Image
    needs: version
    # workflow_dispatch may only build `latest-auto` from a tag
    if: github.event_name != 'workflow_dispatch' || (inputs.latest-auto && github.ref_type == 'tag')
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      platforms: linux/amd64,linux/arm64
      cache: ${{ github.ref_type != 'tag' }}
      cache-mode: max
      set-meta-labels: true
      meta-images: ghcr.io/${{ github.repository }}
      meta-labels: |
        org.opencontainers.image.licenses=GPL-3.0-or-later
        ${{ inputs.latest-auto && format('org.opencontainers.image.version={0}', needs.version.outputs.version) || '' }}
      meta-flavor: |
        latest=${{ inputs.latest-auto && 'false' || 'auto' }}
      meta-tags: |
        type=edge
        type=ref,event=pr
        type=ref,event=branch,enable={{is_default_branch}}
        type=semver,pattern={{version}},enable=${{ !inputs.latest-auto }}
        type=semver,pattern={{major}}.{{minor}},enable=${{ !inputs.latest-auto }}
        type=semver,pattern={{major}},enable=${{ !inputs.latest-auto }}
        type=raw,value=latest-auto,enable=${{ github.ref_type == 'tag' }}
      build-args: |
        UV_DYNAMIC_VERSIONING_BYPASS=${{ needs.version.outputs.version }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
