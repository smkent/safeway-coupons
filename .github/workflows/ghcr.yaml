name: Container Registry

on:
  pull_request:
    types:
      - closed
  schedule:
    - cron: 0 3 * * 0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghcr-cleanup-${{ github.event.pull_request.number || 'scheduled' }}
  cancel-in-progress: false

jobs:
  cleanup-pr:
    name: Remove pull request image
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
    steps:
      - name: 🧹 Remove image for pull request ${{ github.event.pull_request.number }}
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          delete-tags: pr-${{ github.event.pull_request.number }}

  cleanup-stale:
    name: Remove stale images
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
    steps:
      - name: 🧹 Remove stray stale images
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          keep-n-tagged: 0
          use-regex: true
          exclude-tags: ^(\d+|\d+\.\d+|\d+\.\d+\.\d+|latest|edge|${{ github.event.repository.default_branch }})$
          older-than: 30 days

  cleanup-untagged:
    name: Remove untagged images
    if: ${{ !cancelled() && !failure() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs:
      - cleanup-pr
      - cleanup-stale
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
    steps:
      - name: 🧹 Remove untagged container images
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          delete-untagged: true
          older-than: 1 hour

      - name: 🧹 Remove untagged container images
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          delete-orphaned-images: true
